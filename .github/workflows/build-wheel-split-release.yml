name: Build BMW X5 split wheels and MudRunner assets

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install only Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa libgl1 python3-pil

      - name: Download portable Blender 4.2 LTS
        run: |
          set -eux
          BLENDER_VERSION=4.2.0
          ARCHIVE=/tmp/blender-4.2.0-linux-x64.tar.xz
          URL=https://mirrors.ocf.berkeley.edu/blender/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          MIRROR=https://mirrors.ocf.berkeley.edu/blender/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          if ! curl --retry 3 --retry-delay 2 -L --fail -A "Mozilla/5.0" -o "$ARCHIVE" "$URL"; then
            echo "Primary Blender download failed; trying Berkeley mirror."
            curl --retry 3 --retry-delay 2 -L --fail -A "Mozilla/5.0" -o "$ARCHIVE" "$MIRROR"
          fi
          tar -xJf "$ARCHIVE" -C /tmp
          echo "/tmp/blender-${BLENDER_VERSION}-linux-x64" >> "$GITHUB_PATH"
          /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --version
          /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --python-expr "import numpy; print('NUMPY_OK', numpy.__version__)"
      - name: Split Object_97 into four rims and pair with tires
        run: |
          set -euxo pipefail
          mkdir -p build/split build/export
          /tmp/blender-4.2.0-linux-x64/blender --background \
            --python tools/split_bmw_x5_wheels.py -- \
            --source bmw-x5.glb --out build/split
          test -s build/split/bmw_x5_body.obj
          test -s build/split/wheel_a_side_a.obj
          test -s build/split/wheel_a_side_b.obj
          test -s build/split/wheel_b_side_a.obj
          test -s build/split/wheel_b_side_b.obj
          test -s build/split/SPLIT_REPORT.txt
          test -s build/split/MATERIAL_TEXTURE_INVENTORY.txt
          test -d build/split/textures
          find build/split/textures -maxdepth 1 -type f -name "*.png" -size +0c | grep -q .
          echo "All split OBJ files, extracted textures, and reports are present."

      - name: Download Blender 2.78c and MudRunner exporter
        run: |
          set -eux
          BLENDER278_URL=https://mirrors.ocf.berkeley.edu/blender/release/Blender2.78/blender-2.78c-linux-glibc219-x86_64.tar.bz2
          BLENDER278_FALLBACK=https://ftp.nluug.nl/pub/graphics/blender/release/Blender2.78/blender-2.78c-linux-glibc219-x86_64.tar.bz2
          if ! curl --retry 3 --retry-delay 2 -L --fail -A "Mozilla/5.0" -o /tmp/blender278.tar.bz2 "$BLENDER278_URL"; then
            echo "Berkeley mirror failed; trying NLUUG mirror."
            curl --retry 3 --retry-delay 2 -L --fail -A "Mozilla/5.0" -o /tmp/blender278.tar.bz2 "$BLENDER278_FALLBACK"
          fi
          tar -xjf /tmp/blender278.tar.bz2 -C /tmp
          curl -L --fail -o /tmp/io_scene_mudrunner.zip https://github.com/fred-rum/io_scene_mudrunner/archive/refs/heads/master.zip
          unzip -q /tmp/io_scene_mudrunner.zip -d /tmp
          mv /tmp/io_scene_mudrunner-master /tmp/io_scene_mudrunner

      - name: Export chassis and four separate wheel files
        run: |
          set -euxo pipefail
          BLENDER=/tmp/blender-2.78c-linux-glibc219-x86_64/blender
          ADDON=/tmp/io_scene_mudrunner
          mkdir -p build/export/wheels
          mkdir -p build/export/wheels
          $BLENDER --background --python tools/export_mudrunner_asset_x.py -- --obj build/split/bmw_x5_body.obj --addon-dir "$ADDON" --out build/export/bmw_x5.x
          $BLENDER --background --python tools/export_mudrunner_asset_x.py -- --obj build/split/wheel_a_side_a.obj --addon-dir "$ADDON" --out build/export/wheels/wheel_a_side_a.x --pivot-name wheel_pivot_end_a_side_a 2>&1 | tee build/export/wheels/wheel_a_side_a.log
          $BLENDER --background --python tools/export_mudrunner_asset_x.py -- --obj build/split/wheel_a_side_b.obj --addon-dir "$ADDON" --out build/export/wheels/wheel_a_side_b.x --pivot-name wheel_pivot_end_a_side_b 2>&1 | tee build/export/wheels/wheel_a_side_b.log
          $BLENDER --background --python tools/export_mudrunner_asset_x.py -- --obj build/split/wheel_b_side_a.obj --addon-dir "$ADDON" --out build/export/wheels/wheel_b_side_a.x --pivot-name wheel_pivot_end_b_side_a 2>&1 | tee build/export/wheels/wheel_b_side_a.log
          $BLENDER --background --python tools/export_mudrunner_asset_x.py -- --obj build/split/wheel_b_side_b.obj --addon-dir "$ADDON" --out build/export/wheels/wheel_b_side_b.x --pivot-name wheel_pivot_end_b_side_b 2>&1 | tee build/export/wheels/wheel_b_side_b.log
          test "$(grep -h -c WHEEL_PIVOT_ORIGIN_ZERO_OK build/export/wheels/*.log | awk -F: '{sum += $NF} END {print sum}')" = 4
          grep -q "Frame wheel_pivot_end_a_side_a" build/export/wheels/wheel_a_side_a.x
          grep -q "Frame wheel_pivot_end_a_side_b" build/export/wheels/wheel_a_side_b.x
          grep -q "Frame wheel_pivot_end_b_side_a" build/export/wheels/wheel_b_side_a.x
          grep -q "Frame wheel_pivot_end_b_side_b" build/export/wheels/wheel_b_side_b.x
          test -s build/export/bmw_x5.x
          test -s build/export/wheels/wheel_a_side_a.x
          test -s build/export/wheels/wheel_a_side_b.x
          test -s build/export/wheels/wheel_b_side_a.x
          test -s build/export/wheels/wheel_b_side_b.x

      - name: Compile-check material generator
        run: python3 -m py_compile tools/generate_mudrunner_material_xml.py

      - name: Generate GLB-based material XML and diffuse TGA textures
        run: |
          set -euxo pipefail
          mkdir -p build/release/textures
          python3 tools/generate_mudrunner_material_xml.py
          test -s meshes/trucks/bmw_x5.xml
          test -s meshes/wheels/bmw_x5_end_a_side_a.xml
          test -s meshes/wheels/bmw_x5_end_a_side_b.xml
          test -s meshes/wheels/bmw_x5_end_b_side_a.xml
          test -s meshes/wheels/bmw_x5_end_b_side_b.xml
          echo "All body and wheel material XML files generated from GLB."

      - name: Assemble release archive
        run: |
          set -euxo pipefail
          mkdir -p build/release/meshes/trucks build/release/meshes/wheels build/release/classes/trucks build/release/classes/wheels build/release/textures
          cp build/split/SPLIT_REPORT.txt build/release/
          cp build/split/MATERIAL_TEXTURE_INVENTORY.txt build/release/
          cp -a build/split/textures/. build/release/textures/
          python3 -c 'from pathlib import Path; from PIL import Image; root=Path("build/release/textures"); [(lambda im,src: im.resize((1 << (im.width-1).bit_length(), 1 << (im.height-1).bit_length()), Image.Resampling.LANCZOS).save(src.with_suffix(".tga"), format="TGA"))(Image.open(src).convert("RGBA"),src) for src in root.glob("*.png")]; print("TGA_TEXTURES", len(list(root.glob("*.tga"))))'
          cp build/export/bmw_x5.x build/release/meshes/trucks/bmw_x5.x
          cp meshes/trucks/bmw_x5.xml build/release/meshes/trucks/bmw_x5.xml
          cp meshes/wheels/*.xml build/release/meshes/wheels/
          cp classes/trucks/bmw_x5.xml build/release/classes/trucks/bmw_x5.xml
          cp classes/wheels/bmw_x5_end_a_side_a.xml build/release/classes/wheels/
          cp classes/wheels/bmw_x5_end_a_side_b.xml build/release/classes/wheels/
          cp classes/wheels/bmw_x5_end_b_side_a.xml build/release/classes/wheels/
          cp classes/wheels/bmw_x5_end_b_side_b.xml build/release/classes/wheels/
          test -s build/release/classes/wheels/bmw_x5_end_a_side_a.xml
          test -s build/release/classes/wheels/bmw_x5_end_a_side_b.xml
          test -s build/release/classes/wheels/bmw_x5_end_b_side_a.xml
          test -s build/release/classes/wheels/bmw_x5_end_b_side_b.xml
          test ! -e build/release/classes/wheels/bmw_x5_front.xml
          test ! -e build/release/classes/wheels/bmw_x5_rear.xml

          echo "===== FINAL ZIP INPUT: classes/trucks/bmw_x5.xml ====="
          cat build/release/classes/trucks/bmw_x5.xml
          for wheel_xml in build/release/classes/wheels/bmw_x5_end_*.xml; do
            echo "===== FINAL ZIP INPUT: ${wheel_xml#build/release/} ====="
            cat "$wheel_xml"
          done

          python3 - <<'PY'
          import re
          from pathlib import Path
          import xml.etree.ElementTree as ET

          forbidden = (
              "HardpointX", "HardpointDefaultY", "HardpointDefaultZ",
              "SuspensionMin", "SuspensionStrength", "SoftForceScale",
              "SubstanceFriction", "RadiusOffset",
              "BodyFriction", "AttenEnd", "Color",
          )
          root = Path("build/release/classes")
          for path in root.rglob("*.xml"):
              content = path.read_text(encoding="utf-8")
              ET.fromstring(content)
              for attr in forbidden:
                  assert not re.search(r"\b" + re.escape(attr) + r"\b", content), (
                      "Unsupported attribute %s remains in %s" % (attr, path)
                  )
          truck = ET.parse(root / "trucks/bmw_x5.xml").getroot()
          expected = [
              ("bmw_x5_end_a_side_a", "(1.694; -0.567; 0.842)", "false"),
              ("bmw_x5_end_a_side_b", "(1.694; -0.567; -0.842)", "true"),
              ("bmw_x5_end_b_side_a", "(-1.573; -0.567; 0.842)", "false"),
              ("bmw_x5_end_b_side_b", "(-1.573; -0.567; -0.842)", "true"),
          ]
          actual = [
              (w.get("Type"), w.get("Pos"), w.get("RightSide"))
              for w in truck.findall("./Wheels/Wheel")
          ]
          assert actual == expected, "Final class XML wheel coordinates mismatch: %r" % (actual,)
          wheel_template = """<?xml version="1.0" encoding="UTF-8"?>
          <TruckWheel Mesh="wheels/{name}" Radius="0.39" Width="0.28" Mass="35">
            <WheelTracks _template="Default" />
            <WheelSoftness _template="Default" />
            <WheelFriction _template="Default" />
          </TruckWheel>
          """
          for name, _, _ in expected:
              wheel_name = name + ".xml"
              actual_text = (root / "wheels" / wheel_name).read_text(encoding="utf-8").strip()
              expected_text = wheel_template.format(name=name).strip()
              assert actual_text == expected_text, "Unexpected clean MudRunner wheel XML: " + wheel_name
          truck_text = (root / "trucks/bmw_x5.xml").read_text(encoding="utf-8")
          assert 'CabinPos="(0.2; 1.35; 0.38)"' in truck_text
          assert 'Pos="(2.25; 0.78; 0.0)"' in truck_text
          assert 'SensationMin="(1.5; 0.4; -0.77)"' in truck_text
          assert 'SensationMax="(2.4; 1.1; 0.77)"' in truck_text
          print("CLASS_XML_INPUT_VALIDATION_OK: exact wheel positions, clean wheel schema, camera/headlight/damage")
          PY

          # Required grep-based source check before ZIP packaging.
          if grep -RniE '\b(HardpointX|HardpointDefaultY|HardpointDefaultZ|SuspensionMin|SuspensionStrength|SoftForceScale|SubstanceFriction|RadiusOffset|BodyFriction|AttenEnd|Color)\b' build/release --include='*.xml'; then
            echo "Forbidden legacy/SnowRunner XML word found before ZIP packaging" >&2
            exit 1
          fi

          cp build/export/wheels/wheel_a_side_a.x build/release/meshes/wheels/bmw_x5_end_a_side_a.x
          cp build/export/wheels/wheel_a_side_b.x build/release/meshes/wheels/bmw_x5_end_a_side_b.x
          cp build/export/wheels/wheel_b_side_a.x build/release/meshes/wheels/bmw_x5_end_b_side_a.x
          cp build/export/wheels/wheel_b_side_b.x build/release/meshes/wheels/bmw_x5_end_b_side_b.x
          cd build/release
          zip -qr ../../BMW_X5_MudRunner_Wheel_Split.zip .
          test -s ../../BMW_X5_MudRunner_Wheel_Split.zip

      - name: Verify final ZIP wheel coordinates and material assignments
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import re
          import zipfile
          import xml.etree.ElementTree as ET
          from pathlib import PurePosixPath
          from PIL import Image

          archive = "BMW_X5_MudRunner_Wheel_Split.zip"
          expected = [
              ("bmw_x5_end_a_side_a", "(1.694; -0.567; 0.842)", "false"),
              ("bmw_x5_end_a_side_b", "(1.694; -0.567; -0.842)", "true"),
              ("bmw_x5_end_b_side_a", "(-1.573; -0.567; 0.842)", "false"),
              ("bmw_x5_end_b_side_b", "(-1.573; -0.567; -0.842)", "true"),
          ]
          forbidden = (
              "HardpointX", "HardpointDefaultY", "HardpointDefaultZ",
              "SuspensionMin", "SuspensionStrength", "SoftForceScale",
              "SubstanceFriction", "RadiusOffset", "BodyFriction",
              "AttenEnd", "Color",
          )
          wheel_class_names = [
              "bmw_x5_end_a_side_a", "bmw_x5_end_a_side_b",
              "bmw_x5_end_b_side_a", "bmw_x5_end_b_side_b",
          ]
          with zipfile.ZipFile(archive) as z:
              names = set(z.namelist())
              class_path = "classes/trucks/bmw_x5.xml"
              assert class_path in names, "Final ZIP is missing " + class_path
              class_bytes = z.read(class_path)
              root = ET.fromstring(class_bytes)
              wheels_node = root.find("Wheels")
              assert wheels_node is not None, "Truck XML has no /Truck/Wheels"
              wheels = wheels_node.findall("Wheel")
              assert len(wheels) == 4, "Expected exactly 4 Wheel elements, got %d" % len(wheels)
              actual = []
              for wheel in wheels:
                  row = (wheel.attrib.get("Type"), wheel.attrib.get("Pos"), wheel.attrib.get("RightSide"))
                  actual.append(row)
                  print('<Wheel Type="%s" Pos="%s" RightSide="%s" />' % row)
              assert actual == expected, "Wheel coordinates/order mismatch: %r" % (actual,)

              expected_wheel_xml = """<?xml version="1.0" encoding="UTF-8"?>
<TruckWheel Mesh="wheels/{name}" Radius="0.39" Width="0.28" Mass="35">
  <WheelTracks _template="Default" />
  <WheelSoftness _template="Default" />
  <WheelFriction _template="Default" />
</TruckWheel>
"""
              for wheel_name in wheel_class_names:
                  wheel_path = "classes/wheels/" + wheel_name + ".xml"
                  assert wheel_path in names, "Missing wheel class XML " + wheel_path
                  actual_xml = z.read(wheel_path).decode("utf-8").strip()
                  assert actual_xml == expected_wheel_xml.format(name=wheel_name).strip(), (
                      "Wheel class XML differs from requested MudRunner schema: " + wheel_path
                  )
              assert "classes/wheels/bmw_x5_front.xml" not in names
              assert "classes/wheels/bmw_x5_rear.xml" not in names

              for name in sorted(n for n in names if n.lower().endswith(".xml")):
                  content = z.read(name).decode("utf-8", "replace")
                  for word in forbidden:
                      assert not re.search(r"\b" + re.escape(word) + r"\b", content), (
                          "Forbidden legacy/SnowRunner XML word %s remains in %s" % (word, name)
                      )

              wheel_mesh_names = [
                  "meshes/wheels/bmw_x5_end_a_side_a.x",
                  "meshes/wheels/bmw_x5_end_a_side_b.x",
                  "meshes/wheels/bmw_x5_end_b_side_a.x",
                  "meshes/wheels/bmw_x5_end_b_side_b.x",
              ]
              for mesh_path, wheel_name in zip(wheel_mesh_names, wheel_class_names):
                  assert mesh_path in names, "Missing wheel mesh " + mesh_path
                  mesh_text = z.read(mesh_path).decode("latin-1", "replace")
                  pivot_name = "wheel_pivot_" + wheel_name.replace("bmw_x5_", "")
                  frame_start = mesh_text.find("Frame " + pivot_name)
                  assert frame_start >= 0, "Wheel .X missing zero-origin pivot frame: " + mesh_path
                  matrix_start = mesh_text.find("FrameTransformMatrix {", frame_start)
                  matrix_open = mesh_text.find("{", matrix_start)
                  matrix_close = mesh_text.find("}", matrix_open)
                  matrix_values = [float(v) for v in re.findall(
                      r"[-+]?(?:\\d+\\.?\\d*|\\.\\d+)(?:[Ee][-+]?\\d+)?",
                      mesh_text[matrix_open + 1:matrix_close]
                  )]
                  assert len(matrix_values) >= 16, "Missing root pivot matrix in " + mesh_path
                  assert max(abs(v) for v in matrix_values[12:15]) <= 0.00001, (
                      "Exported .X pivot translation is not zero in " + mesh_path
                  )

                  # Parse the actual DirectX Mesh vertex lists and ensure their
                  # combined local-space bounds are centered on the zero pivot.
                  mesh_vertices = []
                  number = r"[-+]?(?:\\d+\\.?\\d*|\\.\\d+)(?:[Ee][-+]?\\d+)?"
                  mesh_pattern = re.compile(r"\\bMesh\\s*\\{")
                  for mesh_match in mesh_pattern.finditer(mesh_text):
                      brace = mesh_text.find("{", mesh_match.start())
                      depth = 0
                      close = None
                      for pos in range(brace, len(mesh_text)):
                          if mesh_text[pos] == "{":
                              depth += 1
                          elif mesh_text[pos] == "}":
                              depth -= 1
                              if depth == 0:
                                  close = pos
                                  break
                      assert close is not None, "Unclosed Mesh block in " + mesh_path
                      body = mesh_text[brace + 1:close]
                      count_match = re.match(r"\\s*(\\d+)\\s*;", body)
                      if not count_match:
                          continue
                      vertex_count = int(count_match.group(1))
                      vertex_data = body[count_match.end():]
                      triples = re.findall(
                          r"(" + number + r")\\s*;\\s*(" + number + r")\\s*;\\s*(" + number + r")\\s*;\\s*,?",
                          vertex_data
                      )[:vertex_count]
                      assert len(triples) == vertex_count, (
                          "Could not read all exported mesh vertices in " + mesh_path
                      )
                      mesh_vertices.extend(tuple(float(v) for v in triple) for triple in triples)
                  assert mesh_vertices, "No exported vertices found in " + mesh_path
                  mins = [min(v[i] for v in mesh_vertices) for i in range(3)]
                  maxs = [max(v[i] for v in mesh_vertices) for i in range(3)]
                  bounds_center = [(mins[i] + maxs[i]) * 0.5 for i in range(3)]
                  assert max(abs(v) for v in bounds_center) <= 0.0001, (
                      "Exported wheel mesh geometry is not centered at (0,0,0): %s %r"
                      % (mesh_path, bounds_center)
                  )
                  print("ZIP_WHEEL_ORIGIN_ZERO_OK", mesh_path, bounds_center)

              material_xmls = [
                  "meshes/trucks/bmw_x5.xml",
                  "meshes/wheels/bmw_x5_end_a_side_a.xml",
                  "meshes/wheels/bmw_x5_end_a_side_b.xml",
                  "meshes/wheels/bmw_x5_end_b_side_a.xml",
                  "meshes/wheels/bmw_x5_end_b_side_b.xml",
              ]
              alpha_maps = []
              for xml_name in material_xmls:
                  assert xml_name in names, "Missing material XML " + xml_name
                  mesh_root = ET.fromstring(z.read(xml_name))
                  mats = mesh_root.findall("Material")
                  assert mats, "No material entries in " + xml_name
                  for material in mats:
                      assert material.attrib.get("MeshParts"), (
                          "Material lacks explicit MeshParts in %s: %r" % (xml_name, material.attrib)
                      )
                      assert "Name" not in material.attrib, (
                          "Legacy/default Name material mapping remains in " + xml_name
                      )
                      diffuse = material.attrib.get("DiffuseMap")
                      specular = material.attrib.get("SpecularMap")
                      assert diffuse and specular, "Missing diffuse/specular map in " + xml_name
                      for texture in (diffuse, specular):
                          texture_path = "textures/" + PurePosixPath(texture).name
                          assert texture_path in names, "Missing texture " + texture_path
                      if material.attrib.get("Blending") == "alpha":
                          alpha_maps.append(diffuse)

              assert alpha_maps, "No alpha-blended glass/headlight materials found"
              for texture in alpha_maps:
                  with Image.open(__import__("io").BytesIO(z.read("textures/" + PurePosixPath(texture).name))) as image:
                      image.load()
                      assert image.mode == "RGBA", "%s is not 32-bit RGBA" % texture
                      alpha = image.getchannel("A")
                      lo, hi = alpha.getextrema()
                      assert 90 <= lo <= hi <= 110, "%s alpha range %s is outside 90-110" % (texture, (lo, hi))

              # Wheel maps must retain GLB rubber-black and alloy-silver base colors,
              # rather than the gray 128/128/128 fallback.
              for wheel_xml in material_xmls[1:]:
                  wheel_root = ET.fromstring(z.read(wheel_xml))
                  means = []
                  for material in wheel_root.findall("Material"):
                      tex = "textures/" + PurePosixPath(material.attrib["DiffuseMap"]).name
                      with Image.open(__import__("io").BytesIO(z.read(tex))) as image:
                          rgb = image.convert("RGB")
                          means.append(sum(rgb.resize((1, 1)).getpixel((0, 0))) / 3.0)
                  assert len(means) == 2 and min(means) < 80 and max(means) > 100, (
                      "Wheel diffuse maps do not contain both dark rubber and silver alloy: %s %r"
                      % (wheel_xml, means)
                  )

              # The GLB's red/orange lamp material must survive in the body diffuse maps.
              has_red_orange = False
              body_root = ET.fromstring(z.read(material_xmls[0]))
              for material in body_root.findall("Material"):
                  tex = "textures/" + PurePosixPath(material.attrib["DiffuseMap"]).name
                  with Image.open(__import__("io").BytesIO(z.read(tex))) as image:
                      r, g, b = image.convert("RGB").resize((1, 1)).getpixel((0, 0))
                      if r > 1.5 * max(g, b):
                          has_red_orange = True
                          break
              assert has_red_orange, "No red/orange GLB lamp color found in body diffuse maps"
              print("ZIP_FINAL_VALIDATION_OK wheels=4 alpha_textures=%d wheel_rgb=black_rubber+silver_alloy red_lamp=present" % len(alpha_maps))
          PY

          mkdir -p build/zip_verify
          unzip -q BMW_X5_MudRunner_Wheel_Split.zip -d build/zip_verify
          if grep -RniE '\b(HardpointX|HardpointDefaultY|HardpointDefaultZ|SuspensionMin|SuspensionStrength|SoftForceScale|SubstanceFriction|RadiusOffset|BodyFriction|AttenEnd|Color)\b' build/zip_verify --include='*.xml'; then
            echo "Forbidden legacy/SnowRunner XML word found inside final ZIP" >&2
            exit 1
          fi
          echo "FINAL_ZIP_GREP_CLEAN: no forbidden legacy/SnowRunner XML words"

      - uses: actions/upload-artifact@v4
        with:
          name: BMW_X5_MudRunner_Wheel_Split
          path: BMW_X5_MudRunner_Wheel_Split.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wheel-split-${{ github.run_number }}
          name: BMW X5 MudRunner wheel split build ${{ github.run_number }}
          body: |
